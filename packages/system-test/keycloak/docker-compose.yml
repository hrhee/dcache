services:

  # Mock Helmholtz ID (login.helmholtz.de).
  # Tokens it issues have iss=http://localhost:8085.
  hidah:
    image: registry.hzdr.de/hifis/cloud/access-layer/cloud-portal/hidah:latest
    environment:
      CLIENT_ID: test-client
      CLIENT_SECRET: test-client-secret
      # Redirect for the get-token.py PKCE helper
      REDIRECT_URI: http://localhost:8999/callback
      BIND_HOST: "0.0.0.0:8080"
      # Must be reachable from both the browser (for auth-code redirect) and
      # Keycloak's token/JWKS calls (see configure-keycloak.sh which overrides
      # the server-side URLs with host.docker.internal).
      EXTERNAL_ADDRESS: "http://localhost:8085"
      DB_PATH: /hidah/identities
      PRELOAD_PROFILES_PATH: /hidah/profiles.json
      PRELOADED_PROFILES_OVERRIDE_STORAGE: "true"
    volumes:
      - ./hidah-profiles.json:/hidah/profiles.json:ro
      - hidah-data:/hidah/identities
    ports:
      - "8085:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    # Allows Keycloak container to reach HiDAH on the host at host.docker.internal:8085
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: start-dev
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    depends_on:
      - hidah

volumes:
  hidah-data:
